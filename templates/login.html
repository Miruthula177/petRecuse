{% extends 'base.html' %}

{% block title %}Login - PetRescue Management Portal{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 480px;">
    <h2 class="form-title">Account Login</h2>
    <p class="form-subtitle">Enter your credentials to access your user or admin dashboard.</p>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Log In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account yet? <a href="{% url 'register' %}" style="font-weight: 600;">Register Now</a>
    </div>
</div>
{% endblock %}
